<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>image viewer — orientation mode</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: sans-serif;
      background: #1a1a1a;
      color: #fff;
    }

    h3 {
      margin-bottom: 8px;
    }

    p.description {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }

    #viewer-wrap {
      width: 100%;
      max-width: 900px;
      height: 600px;
      background: #000;
      position: relative;
    }

    #image-container {
      width: 100%;
      height: 100%;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .controls button {
      padding: 8px 16px;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      cursor: pointer;
      font-size: 14px;
      border-radius: 4px;
    }

    .controls button:hover {
      background: #444;
    }

    .controls button.active {
      border-color: #4a9eff;
      color: #4a9eff;
    }

    .options {
      margin-top: 16px;
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: #aaa;
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h3>Orientation Mode</h3>
  <p class="description">
    <code>fitMode: 'orientation'</code> — portrait images fill container width, landscape images fill container height.
    Pan is enabled when the image overflows the container. Zoom and snap view work as usual.
  </p>

  <div id="viewer-wrap">
    <div id="image-container"></div>
  </div>

  <div class="controls">
    <button class="active" data-index="0">Image 1 (landscape)</button>
    <button data-index="1">Image 2 (landscape)</button>
    <button data-index="2">Image 3 (landscape)</button>
    <button data-index="3">Image 4 (landscape)</button>
  </div>

  <div class="options">
    <label>
      <input type="checkbox" id="toggle-top-center" checked />
      <code>initialPosition: 'top-center'</code>
    </label>
    <label>
      <input type="checkbox" id="toggle-snap-view" checked />
      Snap view
    </label>
  </div>

  <link href="../../src/scss/build.scss" rel="stylesheet" type="text/css" />
  <script src="./example.js"></script>
</body>

</html>
